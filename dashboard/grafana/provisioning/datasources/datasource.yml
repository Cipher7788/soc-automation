apiVersion: 1

datasources:
  - name: Wazuh-OpenSearch
    type: grafana-opensearch-datasource
    access: proxy
    url: $WAZUH_INDEXER_URL
    basicAuth: true
    basicAuthUser: $WAZUH_INDEXER_USERNAME
    jsonData:
      database: wazuh-alerts-*
      timeField: timestamp
      version: "2.x"
      flavor: opensearch
      logMessageField: fullLog
      logLevelField: rule.level
      tlsSkipVerify: false
    secureJsonData:
      basicAuthPassword: $WAZUH_INDEXER_PASSWORD
    isDefault: true
    editable: true
