services:
  soc-automation:
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - models:/app/models
      - reports:/app/reports
      - ./rules:/app/rules:ro
      - ./playbooks:/app/playbooks:ro
      - ./data:/app/data:ro
      - ./certs:/app/certs:ro

volumes:
  models:
  reports:
